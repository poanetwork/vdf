[workspace]
members = [
    "vdf",
    "vdf-cli",
    "classgroup",
    "vdf-competition",
    "generate-discriminants",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
repository = "https://github.com/poanetwork/vdf"

[profile.release]
rpath = true
lto   = true
debug = false
# panic = 'abort'
